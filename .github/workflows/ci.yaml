name: CI/CD Pipeline - Employee 3-Tier App (GHCR)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.github/workflows/ci.yaml'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '.github/workflows/ci.yaml'

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------
  # Job 1: Test, Package, and Push Backend Image to GHCR
  # ----------------------------------------------------
  build-push-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Runs tests AND creates the target/*.jar file
      - name: Build & Package (Runs Unit Tests)
        run: |
          cd employee-backend
          mvn clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner Name
        id: repo_owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./employee-backend
          file: ./employee-backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/employee-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/employee-backend:${{ github.sha }}

  # ----------------------------------------------------
  # Job 2: Build and Push Frontend Image to GHCR
  # ----------------------------------------------------
  build-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner Name
        id: repo_owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./employee-frontend
          file: ./employee-frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/employee-frontend:latest
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/employee-frontend:${{ github.sha }}
