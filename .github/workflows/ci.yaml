# ==============================================================
  # STAGE 5A: Deploy to DEV / QA (Local Docker Desktop Cluster)
  # ==============================================================
  deploy-non-prod:
    name: "🚀 Deploy to Non-Prod (${{ github.event.inputs.environment || 'dev' }})"
    runs-on: self-hosted
    needs: build-scan-push
    if: |
      github.event_name != 'pull_request' &&
      (github.event.inputs.environment == 'dev' ||
       github.event.inputs.environment == 'qa' ||
       github.event_name == 'push')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Helm Chart to Local Cluster
        shell: bash   # <--- Forces Git Bash on Windows to parse backslashes & variables correctly
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'dev' }}
          DEPLOY_TAG: ${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || needs.build-scan-push.outputs.image_tag }}
          OWNER: ${{ needs.build-scan-push.outputs.repo_owner }}
        run: |
          NAMESPACE="employee-${ENV_NAME}"
          echo "Deploying ${DEPLOY_TAG} to namespace ${NAMESPACE} on Docker Desktop cluster..."

          # Ensure namespace exists
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          # Deploy using Helm
          helm upgrade --install employee-app ./helm/employee-app \
            --namespace ${NAMESPACE} \
            -f ./helm/envs/values-${ENV_NAME}.yaml \
            --set backend.image.repository=ghcr.io/${OWNER}/employee-backend \
            --set backend.image.tag=${DEPLOY_TAG} \
            --set frontend.image.repository=ghcr.io/${OWNER}/employee-frontend \
            --set frontend.image.tag=${DEPLOY_TAG} \
            --wait \
            --timeout 5m

  # ==============================================================
  # STAGE 5B: Deploy to PROD (Approval Gate -> Local Cluster)
  # ==============================================================
  deploy-prod:
    name: "🚢 Deploy to Production (Docker Desktop Cluster)"
    runs-on: self-hosted
    needs: build-scan-push
    if: github.event.inputs.environment == 'prod'
    environment: prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Helm Chart to Production Namespace
        shell: bash   # <--- Forces Git Bash on Windows to parse backslashes & variables correctly
        env:
          DEPLOY_TAG: ${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || needs.build-scan-push.outputs.image_tag }}
          OWNER: ${{ needs.build-scan-push.outputs.repo_owner }}
        run: |
          NAMESPACE="employee-prod"
          echo "Deploying verified release ${DEPLOY_TAG} to namespace ${NAMESPACE}..."

          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install employee-app ./helm/employee-app \
            --namespace ${NAMESPACE} \
            -f ./helm/envs/values-prod.yaml \
            --set backend.image.repository=ghcr.io/${OWNER}/employee-backend \
            --set backend.image.tag=${DEPLOY_TAG} \
            --set frontend.image.repository=ghcr.io/${OWNER}/employee-frontend \
            --set frontend.image.tag=${DEPLOY_TAG} \
            --wait \
            --timeout 5m
