# ==============================================================
# Employee 3-Tier App - Complete DevSecOps CI/CD Pipeline
# ==============================================================
# Stages:
# 1. Java Unit Testing & Backend Compile
# 2. Snyk SAST (Code Test) & SCA (Dependencies Test)
# 3. Dockerfile Linting (Hadolint)
# 4. Build Locally -> Trivy Image Vulnerability Scan -> Push to GHCR
# 5A. Deploy to DEV / QA (Local Docker Desktop via Self-Hosted Runner)
# 5B. Deploy to PROD (Approval Gate -> Local Docker Desktop)
# ==============================================================

name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - 'k8s/**'
      - '.github/workflows/**'
  pull_request:
    branches: ["main", "master"]
    paths-ignore:
      - 'k8s/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Target Deployment Environment'
        required: true
        default: 'dev'
        options:
          - dev
          - qa
          - prod
      image_tag:
        type: string
        description: 'Image tag to deploy (Leave blank to use git short SHA)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # ==============================================================
  # STAGE 1: Java Unit Testing & Compile
  # ==============================================================
  test-backend:
    name: "🧪 Test & Compile Backend"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Unit Tests
        run: |
          cd employee-backend
          mvn clean test

  # ==============================================================
  # STAGE 2: Snyk Security Scans (SAST & SCA)
  # ==============================================================
  snyk-scan:
    name: "🛡️ Snyk SAST (Code) & SCA (Dependencies)"
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # 1. SAST: Scan source code
      - name: Run Snyk Code (SAST)
        run: snyk code test --severity-threshold=high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 2. SCA: Scan third-party Maven dependencies
      - name: Run Snyk Open Source (SCA)
        run: snyk test --file=employee-backend/pom.xml --severity-threshold=high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ==============================================================
  # STAGE 3: Dockerfile Linting (Hadolint)
  # ==============================================================
  dockerfile-lint:
    name: "📋 Lint Dockerfiles"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [employee-backend, employee-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: error

  # ==============================================================
  # STAGE 4: Build Locally -> Scan with Trivy -> Push to GHCR
  # ==============================================================
  build-scan-push:
    name: "🐳 Build, Scan & Push"
    runs-on: ubuntu-latest
    needs: [snyk-scan, dockerfile-lint]
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      repo_owner: ${{ steps.repo_owner.outputs.OWNER }}
    strategy:
      matrix:
        component: [employee-backend, employee-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Backend Package)
        if: matrix.component == 'employee-backend'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Package Backend Executable JAR
        if: matrix.component == 'employee-backend'
        run: |
          cd employee-backend
          mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase Repository Owner Name
        id: repo_owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          load: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/${{ matrix.component }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/${{ matrix.component }}:${{ steps.vars.outputs.sha_short }}

      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/${{ matrix.component }}:${{ steps.vars.outputs.sha_short }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Verified Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          OWNER=${{ steps.repo_owner.outputs.OWNER }}
          IMAGE=${{ matrix.component }}
          TAG=${{ steps.vars.outputs.sha_short }}

          docker push ghcr.io/${OWNER}/${IMAGE}:latest
          docker push ghcr.io/${OWNER}/${IMAGE}:${TAG}

  # ==============================================================
  # STAGE 5A: Deploy to DEV / QA (Local Docker Desktop Cluster)
  # ==============================================================
  deploy-non-prod:
    name: "🚀 Deploy to Non-Prod (${{ github.event.inputs.environment || 'dev' }})"
    runs-on: self-hosted
    needs: build-scan-push
    if: |
      github.event_name != 'pull_request' &&
      (github.event.inputs.environment == 'dev' ||
       github.event.inputs.environment == 'qa' ||
       github.event_name == 'push')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Helm Chart to Local Cluster
        shell: bash
        env:
          ENV_NAME: ${{ github.event.inputs.environment || 'dev' }}
          DEPLOY_TAG: ${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || needs.build-scan-push.outputs.image_tag }}
          OWNER: ${{ needs.build-scan-push.outputs.repo_owner }}
        run: |
          NAMESPACE="employee-${ENV_NAME}"
          echo "Deploying ${DEPLOY_TAG} to namespace ${NAMESPACE} on Docker Desktop cluster..."

          # Ensure namespace exists
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          # Deploy using Helm
          helm upgrade --install employee-app ./helm/employee-app \
            --namespace "${NAMESPACE}" \
            -f "./helm/envs/values-${ENV_NAME}.yaml" \
            --set backend.image.repository="ghcr.io/${OWNER}/employee-backend" \
            --set backend.image.tag="${DEPLOY_TAG}" \
            --set frontend.image.repository="ghcr.io/${OWNER}/employee-frontend" \
            --set frontend.image.tag="${DEPLOY_TAG}" \
            --wait \
            --timeout 5m0s

  # ==============================================================
  # STAGE 5B: Deploy to PROD (Approval Gate -> Local Cluster)
  # ==============================================================
  deploy-prod:
    name: "🚢 Deploy to Production (Docker Desktop Cluster)"
    runs-on: self-hosted
    needs: build-scan-push
    if: github.event.inputs.environment == 'prod'
    environment: prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Helm Chart to Production Namespace
        shell: bash
        env:
          DEPLOY_TAG: ${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || needs.build-scan-push.outputs.image_tag }}
          OWNER: ${{ needs.build-scan-push.outputs.repo_owner }}
        run: |
          NAMESPACE="employee-prod"
          echo "Deploying verified release ${DEPLOY_TAG} to namespace ${NAMESPACE}..."

          # Ensure namespace exists
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

          # Deploy Helm release to prod with 5-minute timeout
          helm upgrade --install employee-app ./helm/employee-app \
            --namespace "${NAMESPACE}" \
            -f "./helm/envs/values-prod.yaml" \
            --set backend.image.repository="ghcr.io/${OWNER}/employee-backend" \
            --set backend.image.tag="${DEPLOY_TAG}" \
            --set frontend.image.repository="ghcr.io/${OWNER}/employee-frontend" \
            --set frontend.image.tag="${DEPLOY_TAG}" \
            --wait \
            --timeout 5m0s
