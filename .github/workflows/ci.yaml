# ==============================================================
# Employee 3-Tier App - Complete DevSecOps CI Pipeline
# ==============================================================
# Stages:
# 1. Java Unit Testing & Backend Compile
# 2. Snyk SAST (Code Test) & SCA (Dependencies Test)
# 3. Dockerfile Linting (Hadolint)
# 4. Build Locally -> Trivy Image Vulnerability Scan -> Push to GHCR
# ==============================================================

name: DevSecOps CI Pipeline

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - 'k8s/**'
      - '.github/workflows/**'
  pull_request:
    branches: ["main", "master"]
    paths-ignore:
      - 'k8s/**'
      - '.github/workflows/**'

permissions:
  contents: read
  packages: write

jobs:
  # ==============================================================
  # STAGE 1: Java Unit Testing & Compile
  # ==============================================================
  test-backend:
    name: "🧪 Test & Compile Backend"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Unit Tests
        run: |
          cd employee-backend
          mvn clean test

  # ==============================================================
  # STAGE 2: Snyk Security Scans (SAST & SCA)
  # ==============================================================
  snyk-scan:
    name: "🛡️ Snyk SAST (Code) & SCA (Dependencies)"
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Install Snyk CLI
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # 1. SAST: Scan source code (.java and .js files)
      - name: Run Snyk Code (SAST)
        run: snyk code test --severity-threshold=high
        continue-on-error: true # Set to false to strictly block on high/critical vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 2. SCA: Scan third-party Maven dependencies (pom.xml)
      - name: Run Snyk Open Source (SCA)
        run: snyk test --file=employee-backend/pom.xml --severity-threshold=high
        continue-on-error: true # Set to false to strictly block on high/critical CVEs
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ==============================================================
  # STAGE 3: Dockerfile Linting (Hadolint)
  # ==============================================================
  dockerfile-lint:
    name: "📋 Lint Dockerfiles"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [employee-backend, employee-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: error

  # ==============================================================
  # STAGE 4: Build Locally -> Scan with Trivy -> Push to GHCR
  # ==============================================================
  build-scan-push:
    name: "🐳 Build, Scan & Push"
    runs-on: ubuntu-latest
    needs: [snyk-scan, dockerfile-lint]
    strategy:
      matrix:
        component: [employee-backend, employee-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Backend Package)
        if: matrix.component == 'employee-backend'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Package Backend Executable JAR
        if: matrix.component == 'employee-backend'
        run: |
          cd employee-backend
          mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase Repository Owner Name
        id: repo_owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 1. Build local container image without pushing
      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          load: true # Loads the built image directly into the local Docker engine
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/${{ matrix.component }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/${{ matrix.component }}:${{ steps.vars.outputs.sha_short }}

      # 2. Shift-Left Image Scan (Trivy)
      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/${{ matrix.component }}:${{ steps.vars.outputs.sha_short }}"
          format: "table"
          exit-code: "0" # Set to 1 in production to block push on critical/high CVEs
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # 3. Authenticate to GHCR (Only runs if Trivy completes)
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Push verified container image to GHCR
      - name: Push Verified Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          OWNER=${{ steps.repo_owner.outputs.OWNER }}
          IMAGE=${{ matrix.component }}
          TAG=${{ steps.vars.outputs.sha_short }}
          
          docker push ghcr.io/${OWNER}/${IMAGE}:latest
          docker push ghcr.io/${OWNER}/${IMAGE}:${TAG}
