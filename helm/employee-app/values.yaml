namespace: employee-app

database:
  name: "employee_db"
  user: "postgres"
  password: "Password123!"
  storage: 5Gi
  image: postgres:16-alpine

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/seshadrirc/employee-backend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/seshadrirc/employee-frontend
    tag: latest
    pullPolicy: Always
  service:
    type: NodePort
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi