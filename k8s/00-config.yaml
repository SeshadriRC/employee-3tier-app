apiVersion: v1
kind: Namespace
metadata:
  name: employee-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: employee-app
data:
  POSTGRES_DB: "employee_db"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/employee_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: employee-app
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"