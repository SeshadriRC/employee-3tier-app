apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-frontend
  namespace: employee-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-frontend
  template:
    metadata:
      labels:
        app: employee-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/seshadrirc/employee-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: employee-app
spec:
  type: NodePort
  selector:
    app: employee-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080